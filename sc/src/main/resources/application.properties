# Conexión Dinámica (Usa variables de entorno en la nube o localhost por defecto)
spring.datasource.url=jdbc:mysql://localhost:3306/spring_security
spring.datasource.username=root
spring.datasource.password=

# Puerto Dinámico (CRÍTICO para Render)
# server.port=${PORT:8080}
# JPA config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true 
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Spring Security
# spring.security.user.name = Chris
