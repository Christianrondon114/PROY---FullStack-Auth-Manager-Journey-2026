<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/public/cart-style.css">
</head>
<body class="bg-light"> <div id="navbar-container"></div>

<main class="container py-5">
    <h2 class="mb-4">Shopping Cart</h2>

    <div class="row g-4 align-items-start">

        <div class="col-lg-8">
            <div id="cart-items-container">
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card shadow-sm border-0 p-4 sticky-top" style="top: 100px; z-index: 10;">
                <h3 class="h5 mb-4">Summary</h3>

                <div class="d-flex justify-content-between mb-2">
                    <span class="text-muted">Products</span>
                    <span id="summary-subtotal">$0</span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <span class="text-muted">Shipping</span>
                    <span class="text-success fw-bold">Free</span>
                </div>
                <hr>
                <div class="d-flex justify-content-between mb-4">
                    <span class="fw-bold">Total</span>
                    <span class="fw-bold h4 mb-0 text-primary" id="summary-total">$0.00</span>
                </div>

                <button class="btn btn-primary btn-lg w-100 mb-2 rounded-3">Checkout</button>
                <button class="btn btn-link btn-sm w-100 text-danger text-decoration-none" onclick="clearAllCart()">
                    <i class="bi bi-trash"></i> Empty Cart
                </button>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/navbar-loader.js"></script>
<script src="../../js/public/shopping-cart.js"></script>
<script src="../../js/public/cart-view.js"></script>
</body>
</html>
