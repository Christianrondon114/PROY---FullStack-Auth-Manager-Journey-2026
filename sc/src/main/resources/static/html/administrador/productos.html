<!DOCTYPE html>
<html>
<head>
    <title>Products - CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="navbar-container"></div>
<main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="fw-bold mb-0">Products Management</h2>
            <p class="text-muted">CRUD Products test</p>
        </div>
        <button type="button" class="btn btn-primary shadow-sm" data-bs-toggle="modal"
                data-bs-target="#createProductModal">
            <i class="bi bi-plus-lg"></i> + New Product
        </button>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Available</th>
                    </tr>
                    </thead>
                    <tbody id="products-table-body">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="modal fade" id="createProductModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold" id="modalTitle">Create Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="createProductForm">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Name Product</label>
                            <input type="text" id="nameInput" class="form-control" placeholder="Ej: Mouse Gamer"
                                   required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Description</label>
                            <textarea id="descriptionInput" class="form-control" rows="2"
                                      placeholder="Maximum speed of 150 ips..." required></textarea></div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" id="priceInput" class="form-control" step="0.01"
                                           placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Stock</label>
                                <input type="number" id="stockInput" class="form-control" step="1" placeholder="0"
                                       required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Category</label>
                            <input type="text" id="categoryInput" class="form-control" placeholder="Mouses" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Discount (%)</label>
                                <input type="number" id="discountInput" class="form-control" placeholder="0">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Brand</label>
                                <input type="text" id="brandInput" class="form-control" placeholder="Logitech" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Image URL</label>
                            <input type="url" id="imageUrlInput" class="form-control"
                                   placeholder="https://example.com/still-learning-management-files-:P.jpg">
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="availableInput" checked>
                            <label class="form-check-label fw-bold small" for="availableInput">Product Available</label>
                        </div>

                        <div class="modal-footer border-0 p-3">
                            <button type="button" class="btn btn-link text-muted decoration-none"
                                    data-bs-dismiss="modal">
                                Cancel
                            </button>
                            <button type="submit" onclick="createProduct()" class="btn btn-primary px-4">Save Product
                            </button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="updateProductModal" tabindex="-1" aria-labelledby="updateModalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white"> <h5 class="modal-title fw-bold" id="updateModalTitle">Update Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="updateProductForm">
                        <input type="hidden" id="updateIdInput">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Name Product</label>
                            <input type="text" id="updateNameInput" class="form-control" placeholder="Ej: Mouse Gamer" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Description</label>
                            <textarea id="updateDescriptionInput" class="form-control" rows="2" required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" id="updatePriceInput" class="form-control" step="0.01" placeholder="0.00" required>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Stock</label>
                                <input type="number" id="updateStockInput" class="form-control" step="1" placeholder="0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Category</label>
                            <input type="text" id="updateCategoryInput" class="form-control" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Discount (%)</label>
                                <input type="number" id="updateDiscountInput" class="form-control" placeholder="0">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-muted small fw-bold">Brand</label>
                                <input type="text" id="updateBrandInput" class="form-control" placeholder="Logitech" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Image URL</label>
                            <input type="text" id="updateImageInput" class="form-control" placeholder="https://example.com/still-learning-management-files-:P.jpg">
                        </div>

                        <div class="mb-3 form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="updateAvailableInput">
                            <label class="form-check-label fw-bold small" for="updateAvailableInput">Product Available</label>
                        </div>

                        <div class="modal-footer border-0 p-3">
                            <button type="button" class="btn btn-link text-muted decoration-none" data-bs-dismiss="modal">
                                Cancel
                            </button>
                            <button type="button" onclick="updateProduct()" class="btn btn-success px-4">Update Product</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="ProductDetailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title fw-bold">Product Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">ID</label>
                        <span id="viewId" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Name</label>
                        <span id="viewName" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Description</label>
                        <span id="viewDescription" class="fs-5"></span>
                    </div>
                    <div class="mb-0">
                        <label class="text-muted small fw-bold d-block">Price</label>
                        <span id="viewPrice" class="badge bg-info fs-6"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Stock</label>
                        <span id="viewStock" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Category</label>
                        <span id="viewCategory" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Discount</label>
                        <span id="viewDiscount" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Brand</label>
                        <span id="viewBrand" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Image</label>
                        <span id="viewImage" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">Available</label>
                        <span id="viewAvailable" class="fs-5"></span>
                    </div>
                    <div class="mb-3">
                        <label class="text-muted small fw-bold d-block">ReleaseDate</label>
                        <span id="viewReleaseDate" class="fs-5"></span>
                    </div>

                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>


</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/navbar-loader.js"></script>
<script src="/js/administrador/products-management.js"></script>

</body>
</html>
